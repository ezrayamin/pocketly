name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 17 }
      - run: cd shared && ./gradlew jvmTest --console=plain

  android:
    runs-on: ubuntu-latest
    needs: [js, shared]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 17 }
      - run: yarn install --frozen-lockfile
      - name: Create debug keystore (git-ignored)
        run: keytool -genkeypair -keystore apps/mobile/android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - run: cd apps/mobile/android && ./gradlew assembleJsCoreRelease assembleKmpCoreRelease -PreactNativeArchitectures=arm64-v8a --console=plain
