[versions]
# Kotlin + AGP are pinned to what React Native 0.87 uses
# (node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml), because this
# build is included into apps/mobile/android as a composite build.
kotlin = "2.2.0"
agp = "9.2.1"
coroutines = "1.10.2"
serialization = "1.9.0"
koin = "4.1.1"
sqldelight = "2.2.1"
# The same version @sbaiahmed1/react-native-biometrics pulls into the app (ADR-0012), so one copy ships.
biometric = "1.4.0-alpha04"
# BM-10 only (ADR-0010 §8): pure-Kotlin HMAC-SHA256, the counterpart of @noble/hashes in jsCore.
kotlincrypto-macs = "0.8.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
kotlincrypto-hmac-sha2 = { module = "org.kotlincrypto.macs:hmac-sha2", version.ref = "kotlincrypto-macs" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
