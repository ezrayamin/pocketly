apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // Hoisted to the monorepo root by Yarn workspaces.
    reactNativeDir = file("../../../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    cliFile = file("../../../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = ["jsCoreDebug", "jsCoreDebugOptimized", "kmpCoreDebug", "kmpCoreDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermes-compiler is hoisted to the monorepo root, where the default lookup misses it.
    hermesCommand = "$rootDir/../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true  // BM-PAR-05: same R8 setting for both flavors

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.pocketly"
    defaultConfig {
        applicationId "com.pocketly"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // ADR-0008: developer tools (menu + pocketly://dev links) in every build we produce
        // (debug, demo, benchmarks). A store build passes -PproductionBuild to remove them.
        resValue "bool", "pocketly_dev_tools", project.hasProperty("productionBuild") ? "false" : "true"
        // Benchmark launch arguments (LaunchArgs.kt): read by perf builds only.
        resValue "bool", "pocketly_launch_args", "false"
    }

    // BM-08: one APK per ABI (≈ what a device downloads). Opt-in: -PsplitApksByAbi
    splits {
        abi {
            enable project.hasProperty("splitApksByAbi")
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }

    // benchmarking.md §3.2: one app, two cores. The ONLY difference between the
    // flavors is where business logic runs. Both install side by side.
    flavorDimensions "core"
    productFlavors {
        jsCore {
            dimension "core"
            applicationIdSuffix ".js"
            resValue "string", "app_name", "Pocketly JS"
        }
        kmpCore {
            dimension "core"
            applicationIdSuffix ".kmp"
            resValue "string", "app_name", "Pocketly KMP"
            // Debug builds fetch JS from the Metro serving core-kmp (metro.config.js).
            resValue "integer", "react_native_dev_server_port", "8082"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        // Benchmarks (docs/benchmarking.md §5.3): release in every respect (R8, bundled JS,
        // Hermes, profileable, same package ids) plus launch arguments, so a run picks its
        // dataset, network and start tab at cold start. Release itself ignores them.
        perf {
            initWith release
            matchingFallbacks = ["release"]
            // The RN Gradle plugin sets this for debug/release only; release's value.
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            resValue "bool", "pocketly_launch_args", "true"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // RN 0.87 keeps the native view registry in a MutableIntObjectMap, which androidx.collection
    // 1.4.0–1.4.2 can corrupt: views go missing ("Unable to find viewState for tag N") and fast
    // list recycling ends in "Unable to find parentView" crashes (seen in BM-02). Fixed in 1.4.3;
    // RN 0.88 bumps it. reactwg/react-native-releases#1426, issuetracker.google.com/352560465.
    // Remove once React Native is ≥ 0.88.
    implementation("androidx.collection:collection:1.4.4")

    // jsCore ships with no Kotlin core code (H5 / BM-08).
    kmpCoreImplementation project(":pocketly_core-kmp")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// kmpCore bundles resolve `@pocketly/core-impl` to core-kmp (see metro.config.js).
// Applied once the task graph is ready: the RN plugin `set()`s extraPackagerArgs when it
// registers the task, which would overwrite a plain configureEach.
gradle.taskGraph.whenReady { graph ->
    graph.allTasks
        .findAll { it.project == project && it.name ==~ /createBundleKmpCore.*JsAndAssets/ }
        .each { it.extraPackagerArgs.addAll(["--config", file("../../metro.kmp.config.js").absolutePath]) }
}

// ADR-0009: op-sqlite (bundled SQLite) serves core-js only. Its Turbo Module glue must stay
// autolinked in both flavors, but kmpCore never loads it, so its native library is stripped
// from kmpCore APKs: BM-08 then charges the bundled SQLite to jsCore alone.
androidComponents {
    onVariants(selector().withFlavor(new kotlin.Pair("core", "kmpCore"))) { variant ->
        variant.packaging.jniLibs.excludes.add("**/libop-sqlite.so")
    }
}
