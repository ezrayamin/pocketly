# NFR-TEST-04: QR Pay with a dynamic code (FR-QR-03): the amount is the server's request, locked,
# and the code pays once. pocketly.seed resets the data, so the seeded request pr-0001 is open.
#   maestro test -e APP_ID=com.pocketly.js -e PIN=482915 apps/mobile/e2e/qr-pay-dynamic.yaml
# Maestro 2.11's driver dies on the vivo V2538 (benchmarking.md §5 note); there the same
# checks are run with adb input. This flow is for devices where Maestro works.
appId: ${APP_ID}
---
- stopApp
- launchApp:
    clearState: false
    arguments:
      pocketly.skipLock: true
      pocketly.seed: 42
      pocketly.transactionCount: 200
      pocketly.network.mode: NORMAL
      pocketly.network.failureRatePercent: 0
- openLink: "pocketly://dev/scan?code=pocketly%3A%2F%2Fpay%2Fv1%3Fm%3Dm-01%26r%3Dpr-0001"
- assertVisible: "Pay $12.50"
- tapOn:
    id: "qr-review-confirm"
- runFlow:
    file: enter-pin.yaml
- assertVisible:
    id: "qr-result-success"
- tapOn:
    id: "qr-result-done"
- openLink: "pocketly://dev/scan?code=pocketly%3A%2F%2Fpay%2Fv1%3Fm%3Dm-01%26r%3Dpr-0001"
- assertVisible: "This payment code has already been paid."
