// Jetpack Macrobenchmark (benchmarking.md §5): BM-01 cold startup, BM-09 baseline profile.
// Lives in benchmarks/ but builds inside apps/mobile/android (see its settings.gradle).
//
// Self-instrumenting: one test APK measures EITHER app by package name
// (-e targetPackage com.pocketly.js|com.pocketly.kmp), so runs can alternate js/kmp
// without rebuilding (§4.2). The apps themselves are the normal release APKs.

apply plugin: "com.android.test"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.pocketly.benchmark"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The app's flavors are irrelevant here (target is chosen at run time).
        missingDimensionStrategy "core", "jsCore"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    targetProjectPath = ":app"
    experimentalProperties["android.experimental.self-instrumenting"] = true
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation "androidx.benchmark:benchmark-macro-junit4:1.5.0"
    implementation "androidx.test.ext:junit:1.3.0"
    implementation "androidx.test.uiautomator:uiautomator:2.4.0"
    implementation "androidx.test:runner:1.7.0"
}
